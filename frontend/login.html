<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibShare - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    .brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand h1 {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .brand p {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:active {
      transform: scale(0.99);
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }
    .footer-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="brand">
    <h1>📚 LibShare</h1>
    <p>Sign in to your library account</p>
  </div>

  <div id="alertBox" class="alert alert-error"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="student@lib.com" required autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
    </div>

    <button id="loginBtn" type="submit" class="btn">Sign In</button>
  </form>

  <p class="footer-link">
    Don't have an account? <a href="register.html">Register here</a>
  </p>
</div>

<script>
  // If already logged in, redirect straight to dashboard
  if (localStorage.getItem("token")) {
    window.location.href = "dashboard.html";
  }

  function showAlert(msg) {
    const alertBox = document.getElementById("alertBox");
    alertBox.textContent = msg;
    alertBox.style.display = "block";
  }

  function hideAlert() {
    document.getElementById("alertBox").style.display = "none";
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideAlert();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");

    if (!email || !password) {
      showAlert("Please enter both email and password.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Signing in...";

    try {
      const res = await fetch("http://localhost:5000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok || !data.token) {
        showAlert(data.message || "Login failed. Please check your credentials.");
        btn.disabled = false;
        btn.textContent = "Sign In";
        return;
      }

      localStorage.setItem("token", data.token);
      localStorage.setItem("role", data.role || "student");
      localStorage.setItem("name", data.name || "User");
      localStorage.setItem("email", data.email || email);

      window.location.href = "dashboard.html";
    } catch (err) {
      console.error(err);
      showAlert("Cannot connect to server. Ensure the backend server is running on port 5000.");
      btn.disabled = false;
      btn.textContent = "Sign In";
    }
  }
</script>

</body>
</html>
