<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibShare - Library Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .landing-card {
      background: white;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .brand-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

<div class="landing-card">
  <div class="brand-icon">📚</div>
  <h1>Welcome to LibShare</h1>
  <p>Your streamlined library book sharing and management platform.</p>

  <div class="btn-group">
    <a id="dashboardLink" href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
    <a id="loginLink" href="login.html" class="btn btn-secondary">Sign In</a>
    <a id="registerLink" href="register.html" class="btn btn-secondary">Create Account</a>
  </div>
</div>

<script>
  // Automatic routing based on authentication state
  const token = localStorage.getItem("token");
  if (token) {
    window.location.replace("dashboard.html");
  } else {
    window.location.replace("login.html");
  }
</script>

</body>
</html>
